# Version updates disabled (open-pull-requests-limit: 0): repo is dormant.
# Dependabot security updates are unaffected; they use a separate internal limit.
# BRO-2600
version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    open-pull-requests-limit: 0
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "monthly"
